html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100vh; /* Fallback */
    height: 100svh; /* Small Viewport Height - excludes browser UI on mobile */

    overflow: hidden;
}


media-controller {
    width: 100%;
    height: 100%;
    position: relative; /* anchor gradient and overlay children */
    --media-control-padding: 6px;
    --media-button-icon-height: 22px;
    --media-primary-color: white;
    --media-secondary-color: #f44336;
    --media-text-color: white;
    --media-text-background: transparent;
    --media-icon-color: white;
    --media-font-family: rubik, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    --media-font-size: 14px;
    --media-control-background: transparent;
    --media-control-hover-background: rgba(255, 255, 255, 0.1);
    background: transparent;
}

video {
    width: 100%;
    height: 100%;
    object-fit: contain;
    background: #000;
}

/* Large play button - translucent circle over the frame, hidden while playing */
media-controller media-play-button.large-play {
    /* Media Chrome sizes icons from --media-button-icon-height, which is declared once
       on media-controller at 22px for the 32px control-bar buttons. Without overriding
       it here the glyph inherits that size inside an 80px circle - about 20% of the
       button, against 40-50% in every comparable player (STREAM-1103). The font-size
       that used to sit in this block never did anything: Media Chrome does not size
       icons from it. */
    --play-size: clamp(56px, 18vmin, 80px);
    --media-button-icon-height: calc(var(--play-size) * 0.5);
    --play-shadow: 0 1px 24px rgba(0, 0, 0, 0.35);

    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    /* Smooth scaling instead of one hardcoded size either side of a breakpoint. vmin is
       still a viewport unit, which is exactly right for an iframe embed - the iframe is
       the viewport - but only an approximation for an inline SDK embed. Container
       queries are the correct tool and sit above our browser floor.

       The coefficient is set against the sizes people actually embed at. vmin on a 16:9
       embed is the height, so a low one keeps every real embed pinned to the floor:
       11vmin only reached its cap above 654px tall, which almost nothing is. */
    width: var(--play-size);
    height: var(--play-size);
    border-radius: 50%;
    background: rgba(244, 67, 54, 0.94);
    border: none;
    color: white;
    fill: white;
    display: flex;
    align-items: center;
    justify-content: center;
    /* Named rather than `all`, which also animated the focus ring into view. */
    transition: transform 0.18s cubic-bezier(0.2, 0.7, 0.3, 1),
                background-color 0.18s linear,
                box-shadow 0.18s linear;
    z-index: 10;
    box-shadow: var(--play-shadow);
    padding: 0;
}

/* One explanation at a time (STREAM-829).
   The status message and the countdown are server-rendered from what the API says about
   the video, so they state specifically why playback cannot start; a playback error is a
   downstream symptom of the same thing. Suppress the error overlay rather than stacking
   the two. `data-live` means a live stream became playable and the offline overlays are
   already hidden, so the error is free to show again. */
media-controller[data-status="true"]:not([data-live="true"]) bunny-error-display,
media-controller[data-countdown="true"]:not([data-live="true"]) bunny-error-display {
    display: none !important;
}

/* Nothing to start while a message is showing, so the big play button should not sit on
   top of it. The live-stream cases are covered above; this adds VOD and the error state. */
media-controller[data-status="true"]:not([data-live="true"]) media-play-button.large-play,
media-controller[data-countdown="true"]:not([data-live="true"]) media-play-button.large-play,
media-controller[data-error="true"] media-play-button.large-play {
    display: none !important;
}

/* The gesture receiver listens on the media controller and only uses its own box to
   bound the click; it must never be the hit target, because Media Chrome ignores any
   gesture whose composed target is not the <video> or the controller. Media Chrome's
   own receiver gets this for free inside the shadow root, but a slotted element is
   given pointer-events by ::slotted(), so turn them back off. The stretch rules are
   here for the same reason: Media Chrome sizes its receiver with a tag-name
   ::slotted() rule that does not match ours, and a zero-sized box fails its rect
   check. */
bunny-gesture-receiver[slot="gestures-chrome"] {
    align-self: stretch;
    flex-grow: 1;
    pointer-events: none;
}

bunny-poster-image::part(img) {
    object-fit: cover;
}

bunny-poster-image,
bunny-poster-video {
    --media-poster-image-background-size: cover;
}

bunny-poster-video::part(video) {
    object-fit: cover;
}

/* An active stream whose playlist has been missing for longer than an ingest failover
   takes (STREAM-922): keep the last frame, or the thumbnail when the stream has one, and
   take the spinner and the dead controls off it. The status and countdown overlays are
   not in play here, the control plane still says the stream is running. */
.live-stopped-poster {
    position: absolute;
    inset: 0;
    display: none;
    pointer-events: none;
    z-index: 5;
    background: #000;
}
.live-stopped-poster img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: center;
    display: block;
}
media-controller[data-live-stopped="true"] .live-stopped-poster[data-artwork="true"] {
    display: block;
}
media-controller[data-live-stopped="true"] media-play-button.large-play,
media-controller[data-live-stopped="true"] media-control-bar,
media-controller[data-live-stopped="true"] bunny-media-control-bar,
media-controller[data-live-stopped="true"] bunny-settings-menu,
media-controller[data-live-stopped="true"] media-loading-indicator {
    display: none !important;
}
media-controller[data-live-stopped="true"].has-controls::after {
    display: none;
}

/* Avoid first-paint poster flash while pre-stream trailer is active. */
media-controller[data-trailer-active="true"] bunny-poster-image {
    display: none !important;
}

media-controller media-play-button.large-play:hover {
    transform: translate(-50%, -50%) scale(1.06);
    box-shadow: 0 2px 28px rgba(0, 0, 0, 0.45);
}

media-controller media-play-button.large-play:active {
    transform: translate(-50%, -50%) scale(0.97);
}

/* Media Chrome draws its focus ring with `:host(:focus-visible) { box-shadow: inset ... }`,
   and our own box-shadow on the element beats any :host() rule - so tabbing to the
   largest control in the player produced no visual change at all. */
media-controller media-play-button.large-play:focus-visible {
    outline: none;
    box-shadow: 0 0 0 3px rgba(255, 255, 255, 0.9), var(--play-shadow);
}

/* Show large play only when paused */
media-controller:not([mediapaused]) media-play-button.large-play {
    display: none;
}

/* For live streams, controls are only shown while stream is playable */
media-controller[data-live-stream="true"]:not([data-live="true"]) media-play-button.large-play,
media-controller[data-live-stream="true"]:not([data-live="true"]) media-control-bar,
media-controller[data-live-stream="true"]:not([data-live="true"]) bunny-media-control-bar,
media-controller[data-live-stream="true"][data-countdown="true"] media-play-button.large-play,
media-controller[data-live-stream="true"][data-countdown="true"] media-control-bar,
media-controller[data-live-stream="true"][data-countdown="true"] bunny-media-control-bar,
media-controller[data-live-stream="true"][data-status="true"] media-play-button.large-play,
media-controller[data-live-stream="true"][data-status="true"] media-control-bar,
media-controller[data-live-stream="true"][data-status="true"] bunny-media-control-bar,
media-controller[data-live-stream="true"]:not([data-live="true"]) bunny-settings-menu {
    display: none !important;
}

media-controller[data-live-stream="true"][data-countdown="true"] bunny-settings-menu,
media-controller[data-live-stream="true"][data-status="true"] bunny-settings-menu {
    display: none !important;
}

media-controller[data-live-stream="true"]:not([data-live="true"]) media-loading-indicator {
    display: none !important;
}

media-controller[data-live-stream="true"]:not([data-live="true"]).has-controls::after,
media-controller[data-live-stream="true"][data-countdown="true"].has-controls::after,
media-controller[data-live-stream="true"][data-status="true"].has-controls::after {

/* Hide custom controls when iOS shows native inline UI (playsinline=false) */
media-controller[data-ios-native-ui] media-play-button.large-play,
media-controller[data-ios-native-ui] media-control-bar,
media-controller[data-ios-native-ui] bunny-media-control-bar,
media-controller[data-ios-native-ui] bunny-settings-menu,
media-controller[data-ios-native-ui] media-loading-indicator,
media-controller[data-ios-native-ui] bunny-captions-display {

}

media-controller[data-ios-native-ui]::after {

}

/* =========================
   Control Bar — Layout
   ========================= */
media-control-bar,
bunny-media-control-bar {
    padding: 8px 12px;
    gap: 8px;
    position: relative; /* ensure bars are above the unified gradient */
    z-index: 1;
}

/* Responsive control bar needs constrained width for overflow detection */
bunny-media-control-bar {
    --media-control-bar-display: flex; /* Override inline-flex from shadow DOM */
    width: 100%;
    overflow: hidden;
    min-width: 0; /* Allow container to shrink below content */
}

/* =========================
   Control Bar — Components
   ========================= */
/* Spacer for control bar */
.spacer {
    flex-grow: 1;

/* Time range control bar (top bar) — desktop only */
@media (min-width: 769px) {
    media-control-bar:first-of-type {
        padding: 0 16px;
    }

/* Button control bar (second bar) - reduce top padding to tighten spacing with time bar */

media-control-bar + bunny-media-control-bar {

}

/* Control Bar — Components: button base styles */
media-control-bar :is(

/* =========================
   Control Bar — States
   ========================= */

bunny-media-time-range {
    /* Only set the dynamic color here; component provides other defaults */

    --media-preview-background: rgba(20, 20, 30, .85);
    --media-box-border-radius: 6px;
    --media-box-padding-left: 10px;
    --media-box-padding-right: 10px;

}

/* When time range is placed inside the button bar (small playback bar mode) */
bunny-media-control-bar bunny-media-time-range {
    flex: 1 1 auto;

}

/* =========================
   Small Playback Bar Mode
   ========================= */

/* Only suppress the spacer when the inline time range is present */
media-controller[data-small-bar="true"] bunny-media-control-bar:has(.small-bar-time-range) .spacer {
    display: none;
}

/* Allow seek preview to escape upward out of the button bar in compact mode */

/* Hide heatmap in compact mode — it needs vertical space the inline bar doesn't have */

media-volume-range {

media-settings-menu,

}



/* =========================
   Control Bar — Responsive
   ========================= */
@media (max-width: 768px) {
    media-control-bar,
    bunny-media-control-bar {
        padding: 6px 8px;
        gap: 6px;
    }
    media-control-bar + media-control-bar,
    media-control-bar + bunny-media-control-bar {

    }

    }

@media (max-width: 400px) {

        gap: 4px;
    }
    
    media-control-bar :is(
        media-play-button:not(.large-play),
        media-seek-backward-button,
        media-seek-forward-button,
        media-mute-button,
        media-pip-button,
        media-fullscreen-button,
        media-captions-button,
        media-cast-button,
        media-airplay-button,
        media-settings-menu-button,
        bunny-settings-menu-button
    ),
    bunny-media-control-bar :is(
        media-play-button:not(.large-play),
        media-seek-backward-button,
        media-seek-forward-button,
        media-mute-button,

        media-fullscreen-button,
        media-captions-button,
        media-cast-button,
        media-airplay-button,
        media-settings-menu-button,
        bunny-settings-menu-button
    ) {
        min-width: 28px;
    }
    
    media-time-display {
        font-size: 11px;
        min-width: 60px;
    }
}

/* Unified bottom gradient spanning both control bars - only shown when controls are present */
media-controller.has-controls::after {
    content: "";
    position: absolute;
    left: 0;
    right: 0;
    bottom: 0;
    height: 50px; /* Default height for single row of controls */
    background: linear-gradient(transparent, rgba(0, 0, 0, 0.8));
    pointer-events: none;
    z-index: 0;
    opacity: 1;
    transition: opacity 0.3s ease, height 0.3s ease;
}

/* Taller gradient when both progress and buttons are present */
media-controller.has-full-controls::after {
    height: 100px;
}

/* Hide unified gradient when controls auto-hide (match media-chrome behavior) */
media-controller[userinactive]:not([mediapaused])::after {
    opacity: 0;
}

        .offline-overlay {
            position: absolute;

            width: 100%;

            display: none;

            justify-content: center;
            color: white;

            position: relative;

            max-width: min(90vw, 720px);
            padding: 10px 18px;
            text-shadow: 0 2px 14px rgba(0, 0, 0, 0.45);
        }

            content: "";
            position: absolute;
            left: 50%;
            top: 50%;
            width: min(82vw, 980px);
            height: min(44vw, 460px);
            transform: translate(-50%, -50%);
            border-radius: 999px;
            pointer-events: none;
            z-index: -1;
            background: radial-gradient(
                ellipse at center,
                rgba(0, 0, 0, 0.28) 0%,
                rgba(0, 0, 0, 0.22) 28%,
                rgba(0, 0, 0, 0.15) 44%,
                rgba(0, 0, 0, 0.08) 58%,
                rgba(0, 0, 0, 0.03) 70%,
                transparent 82%
            );
            filter: blur(8px);
        }
        .offline-message {

            font-size: 1.5em;

        }

            display: flex;
        }
        media-controller[data-status="true"] .offline-overlay[data-overlay="status"] {
            display: flex;
        }
        media-controller[data-live="true"] .offline-overlay {
            display: none;
        }

        /* Shown while a Chromecast session is active; replaces the frozen
           local frame. Controls stay usable (they render above this layer)
           so the viewer can pause/seek/stop the cast from the sender. */
        media-controller[data-casting="true"] bunny-cast-overlay {
            display: flex;
        }
        media-controller[data-casting="true"] bunny-poster-image,
        media-controller[data-casting="true"] bunny-poster-video,
        media-controller[data-casting="true"] media-play-button.large-play {
            display: none !important;

        /* Keep the control bar clickable and painted above the overlay so
           the viewer can pause/seek/stop the cast from the sender. */
        media-controller[data-casting="true"] bunny-media-control-bar,
        media-controller[data-casting="true"] media-control-bar {
            z-index: 3;
        }

    </style>
    
</head>

    <script>
        const PLAYER_SELECTOR = 'bunny-stream-video-ads, bunny-stream-video';

function getPlayerElement() {
  return document.querySelector(PLAYER_SELECTOR) || document.querySelector('video');
}

function exposePlayerApi(playerEl) {
  if (typeof window.createBunnyPlayerApi !== 'function') {
    throw new Error('createBunnyPlayerApi is not available');
  }

  const playerApi = window.createBunnyPlayerApi(playerEl);
  window.player = playerApi;
  return playerApi;
}

function initializePlayerJsReceiver(playerEl, playerApi) {
  if (typeof window.BunnyPlayerJsReceiver !== 'function') {
    throw new Error('BunnyPlayerJsReceiver is not available');
  }

  const receiver = new window.BunnyPlayerJsReceiver(playerEl, playerApi);
  receiver.connect();
}

function initializePlayer() {
  const playerEl = getPlayerElement();
  const controller = document.querySelector('media-controller');

  if (!playerEl || !controller) {
    console.error('Required video or media-controller elements not found');
    return;
  }

  const playerApi = exposePlayerApi(playerEl);
  initializePlayerJsReceiver(playerEl, playerApi);
}

// Wait for both DOM content and module script to load
const moduleScript = document.querySelector('script[type="module"]');
if (!moduleScript) {
  throw new Error('Module script not found');
}

// Create a promise that resolves when the module script loads
const moduleLoaded = new Promise((resolve, reject) => {
  moduleScript.addEventListener('load', resolve);
  moduleScript.addEventListener('error', reject);
});

// Create a promise that resolves when the DOM is ready
const domReady = new Promise(resolve => {
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', resolve);
  } else {
    resolve();
  }
});

// Initialize when both DOM and module are ready
Promise.all([domReady, moduleLoaded])
  .then(() => {
    requestAnimationFrame(initializePlayer);
    
    
    // Initialize RUM (Real User Monitoring) if enabled
    try {
      if (window.RumJob) {
        const rumJob = new window.RumJob();
        rumJob.start();
      } else {
        console.warn('RUM tracking requested but RumJob is not available');
      }
    } catch (error) {
      console.error('Failed to initialize RUM:', error);
    }
    
  })
  .catch(error => {
    console.error('Failed to initialize player:', error);
  });

    </script>
