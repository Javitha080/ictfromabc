name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  node-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Offline regression suite
        run: node --test "ict-toolkit/tests/node/*.test.mjs"
